name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Security invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'external-controller: "127.0.0.1:9090"' resources/mixin.yaml
          grep -q '^CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW$' scripts/init/systemd.sh
          ! grep -Eq 'CAP_SYS_PTRACE|CAP_DAC_OVERRIDE|CAP_DAC_READ_SEARCH|CAP_SYS_TIME' scripts/init/systemd.sh
          grep -q '^GH_PROXY=$' .env.install
          grep -q '^CLASHCTL_CHECK_LATEST_VERSION=0$' .env.install
